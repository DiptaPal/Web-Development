<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form</title>
        <style>
            nav {
                display: flex;
                justify-content: space-between;
            }
            nav a {
                text-decoration: none;
                color: black;
            }
            .login-form-container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 90vh;
                border: 1px solid palegreen;
            }
            .login-form {
                text-align: center;
                padding: 24px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 24px;
                width: 50%;
                border: 1px solid blueviolet;
            }
        </style>
    </head>
    <body>
        <nav>
            <div>
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">Service</a>
                <a href="">Blog</a>
            </div>
            <a href="">Login</a>
        </nav>
        <section class="login-form-container">
            <form action="" class="login-form">
                <h3>Please Login</h3>
                <input
                    type="email"
                    required
                    name=""
                    id=""
                    placeholder="Your Email"
                />
                <input
                    type="password"
                    required
                    name=""
                    id=""
                    placeholder="Your Password"
                />
                <input type="submit" value="Login" />
            </form>
        </section>
    </body>
</html>
