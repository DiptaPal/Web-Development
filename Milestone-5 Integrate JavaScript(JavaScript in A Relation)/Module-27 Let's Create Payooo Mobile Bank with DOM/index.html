<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Payoo</title>
        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@5"
            rel="stylesheet"
            type="text/css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-slate-800">
        <section
            class="max-w-md min-h-screen mx-auto py-6 bg-gray-200 flex flex-col justify-center items-center"
        >
            <div class="mb-7">
                <img src="./assets/Logo-full.png" alt="logo" />
            </div>
            <div class="w-[85%] mx-auto">
                <div class="flex-col lg:flex-row-reverse">
                    <div
                        class="card bg-base-100 shrink-0 shadow-md rounded-3xl"
                    >
                        <form class="card-body">
                            <fieldset class="fieldset">
                                <label class="font-medium">Mobile Number</label>
                                <input
                                    id="account-number"
                                    type="number"
                                    class="input rounded-3xl"
                                    placeholder="Enter your number"
                                    value="01230123012"
                                    required
                                />
                                <label class="font-medium">4 Digit Pin</label>
                                <input
                                    id="pin-number"
                                    type="password"
                                    class="input rounded-3xl"
                                    placeholder="Enter 4 Digit Pin"
                                    value="1234"
                                    required
                                />
                                <button
                                    id="login-btn"
                                    class="btn bg-[#3B25C1] text-white mt-4 rounded-3xl"
                                >
                                    Login
                                </button>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <script src="./utilities/utilities.js"></script>
        <script src="./script/login.js"></script>
    </body>
</html>
