<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pseudo</title>
        <style>
            h3 {
                color: peru;
            }
            /* hover means mouse over */
            h3:hover {
                color: tomato;
                background-color: skyblue;
            }
            input:focus {
                color: blue;
                outline: 0;
            }
        </style>
    </head>
    <body>
        <h3>My Heading</h3>
        <input type="text" name="" id="" />
        <input type="text" name="" id="" />
        <input type="text" name="" id="" />
    </body>
</html>
