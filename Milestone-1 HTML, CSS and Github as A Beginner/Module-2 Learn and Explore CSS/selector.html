<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Selector</title>
        <style>
            #short {
                color: red;
                text-align: center;
            }
            p {
                background-color: rgba(189, 183, 107, 0.446);
                width: 50%;
            }
            li {
                color: hwb(0 36% 20%);
            }
            .player {
                text-align: right;
            }
            #embedded {
                font-size: larger;
                font-weight: bolder;
            }
        </style>
    </head>
    <body>
        <h3 style="color: blueviolet">Learning CSS Basic</h3>
        <p>CSS meaning: Cascading Style Sheet</p>
        <p id="short">Style is colorful</p>
        <p>Short from is CSS</p>
        <p class="player">Needs style rule and value separated by color(:)</p>
        <p class="player">After each styles you need to use semi-color(;)</p>
        <ul>
            <li>Inline</li>
            <li id="embedded">Internal or Embedded</li>
            <li>External</li>
        </ul>
        <p class="player">This is a stand alone paragraph</p>
        <p class="player">Cricket Fan</p>
    </body>
</html>
